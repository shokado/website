# Language tour

## Example

In Bento the entry point of your shader receives its inputs as one struct parameter and returns its outputs as another struct. Attributes on the fields describe the bindings.

```bento hello.bento
import std;

struct Pixel {
	[[location(0)]] uv: f32x2,
}

struct Color {
	[[color(0)]] rgba: f32x4,
}

[[stage(.Fragment)]]
fn main(px: Pixel) -> Color {
	let corner = px.uv.x * px.uv.y;
	let glow = std::smoothstep(0.0, 1.0, corner);
	return { f32x4 { px.uv, glow, 1.0 } };
}
```

Structs with bindings can only appear as the parameter or result of an entry point.

## Types

### Scalars, vectors, and matrices

| Kind | Written | Notes |
| --- | --- | --- |
| Booleans | `b8 b16 b32` | 8, 16, or 32 bits wide in memory |
| Integers | `i8 i16 i32 i64 u8 u16 u32 u64` | |
| Floats | `f16 f32` | |
| Vectors | `f32x3`, `u8x4`, `b32x2` | 2 to 4 lanes of any scalar |
| Matrices | `f32x4x4`, `f16x2x3` | floats only, columns first as in GLSL |

Booleans of every width contain only `true` and `false`. Like integers of different widths, they only meet through `as`.

The short names spell a general bracketed form: `f32x3` is `[vector; 3]f32` and `f32x4x3` is `[matrix; 4][vector; 3]f32`. You only need the bracketed form when a size comes from a constant or a generic parameter.

### Named types

Structs, enums, and domains are nominal. Two declarations with the same contents are still different types. Aliases aren't: `type Color = f32x4;` just gives `f32x4` another name. All four can also be declared inside a function body.

Writing `...` in a struct includes the fields of another struct. It isn't inheritance and doesn't make a subtype.

```bento
struct Pair { first: f32, second: f32 }
struct Triple { ...Pair, third: f32 }
```

Enums are `i32` unless another integer type follows the name, as in `enum Mode : u8 { Flat = 1, Lit = 2 }`.

Domains are types whose values are exactly the ones you list, as single values and ranges. `a..=b` includes `b`, `a..<b` stops before it, and `a..` has no end.

```bento
domain Tap : i32 { -2..=2 }
domain Power : u32 { 1, 2, 4, 8 }
domain Mip : f32 { 0.25, 0.5, 1.0 }
```

Constants convert to a domain only when their value is in it, and `let t: Tap = 3;` is an error. Run-time values convert with `as` unchecked, and one outside the domain is undefined, like an index out of range. An enum is just a domain whose values have names.

### Indexed types

Every type written `[kind; parameter]T` is an *indexed type*: indexing it gives a `T`, and types read left to right in the order you index them. Each one has a set of keys, and one rule over those keys covers indexing, initializers, and `for ... in`. A positional initializer lists a value for every key in order, a keyed one writes `KEY = value`, and a range key like `0..<4 = 1.0` covers every key in the range. Missing, unknown, and repeated keys are errors.

| Type | Keys | Gives |
| --- | --- | --- |
| `[array; 4]T`, `[array; ?]T`, `[array; _]T` | an integer below the length | `T` |
| `[table; D]T` | a value of the domain or enum `D` | `T` |
| `[vector; 4]T` | a lane | `T` |
| `[matrix; 4]V` | a column | the column vector `V` |
| `[texture; 2]T`, `[image; 2]T`, `[sampled; 2]T` | integer coordinates | a texel of `T` |
| `[layer; K]I` | a layer | one layer of the image `I` |

### Arrays

Arrays are indexed by integers of any type. `[array; _]T` has no length and only lives in storage memory, like an unsized array in a GLSL buffer block. `[array; ?]T` counts its length from the initializer, as in `[array; ?]u32 { ...1..=4, 8, 16 }`. Lengths can be written with arithmetic, on generic parameters too: `[array; N + M]T` and `[array; M + N]T` are the same type.

### Tables

A table is an array indexed by a domain of its own rather than by every value of an integer type. Other languages call this a sparse array, or an enumerated array when the domain is an enum. Once a domain can mix numbers and named enumerators, the two turn out to be one thing.

A blur kernel with taps from -2 to 2 is the classic case. In GLSL it's a plain array with the offset tracked by hand at every index. Here the table only accepts a `Tap`, and a stray `i32` index is a compile error. A run-time `Tap` becomes its position through `rank`, and every target lowers that to the `+ 2` you'd otherwise write. Constant taps fold to the weight, and `total` disappears once the `const for` is unrolled:

::: pair
```bento before
domain Tap : i32 { -2..=2 }

const WEIGHTS = [table; Tap]f32 {
	0.0625, 0.25, 0.375, 0.25, 0.0625
};

export fn weight(t: Tap) -> f32 {
	return WEIGHTS[t];
}

export fn center() -> f32 {
	return WEIGHTS[0];
}

export fn total() -> f32 {
	let sum: f32 = 0;
	const for t in Tap {
		sum += WEIGHTS[t];
	}
	return sum;
}
```
```ir after
global @WEIGHTS: [table; Tap]f32 constant internal file 0 = $0x1p-4, $0x1p-2, $0x1.8p-2, $0x1p-2, $0x1p-4

fn @weight(Tap) -> f32 export file 0
%bb0(%r1):
	%r3 = global @WEIGHTS
	%r5 = rank.virt %r1
	%r6 = access %r3, %r5
	%r7 = load %r6
	return %r7

fn @center() -> f32 export file 0
%bb0:
	return $0x1.8p-2

fn @total() -> f32 export file 0
%bb0:
	return $1.0
```
:::

Tables over an enum are indexed by enumerator, and `.Name` resolves as it does anywhere the enum is known. Keyed and range initializers suit lookup tables and step functions:

```bento
enum Axis { X, Y, Z }
domain Level : u32 { 0..<16 }

const BLUR = [table; Axis]f32 { 0.25, 0.5, 0.25 };
const SPREAD = [table; Axis]f32 { .Z = 0.25, .X = 0.25, .Y = 0.5 };
const FALLOFF = [table; Level]f32 { 0..<4 = 1.0, 4..<12 = 0.5, 12..<16 = 0.0 };

fn weight(axis: Axis) -> f32 {
	return BLUR[axis] * SPREAD[.Z];
}
```

### Other types

| Kind | Written | Notes |
| --- | --- | --- |
| Tuples | `(f32x3, f32)` | results of a function only |
| References | `&storage [array; _]f32` | memory space written out, see [memory spaces](#memory-spaces) |
| Images and textures | `[image; 2]f32`, `[texture; 2]f32`, `[sampled; 2]f32` | see [images, textures, and samplers](#images-textures-and-samplers) |
| Samplers | `sampler` | bound apart from textures |
| Untyped textures and images | `texture`, `image` | only in heap structs, typed where they're used |
| Rays and scenes | `r32`, `r16`, `scene` | see [ray tracing](#ray-tracing) |

## Literals

GLSL and HLSL quietly turn an `int` into a `float` in mixed arithmetic. In Bento only literals convert implicitly: integer literals to any integer or float type wide enough, and float literals to any float type. With no context they're `i32` and `f32`. Every other conversion is written out with `as`.

```bento strict.bento
fn strict(i: i32, f: f32) -> f32 {
	let a: i8 = 128;
	let b: i32 = 1.5;
	let c: f32 = i;
	let e = f + i;
	return f;
}
```

```text bento-c strict.bento
strict.bento:2:14: error: 128 does not fit in 'i8'
strict.bento:3:15: error: expected 'i32' but found a float literal
strict.bento:4:15: error: expected 'f32' but found 'i32'
strict.bento:5:10: error: '+' cannot be used on 'f32' and 'i32'
```

Integer literals come in decimal, `0x` hex, `0b` binary, and `0o` octal, with `_` between digits. Negated literals still count as literals, and `-128` is a valid `i8`.

## Swizzles, selectors, and spreads

Swizzles take up to four lanes from `xyzw` or `rgba`, and unlike GLSL they can contain `0` and `1`. Any swizzle without repeats or constants can be assigned to.

```bento
let opaque = color.rgb1;
let flat = normal.x0z;
let w = color;
w.xz = normal.yx;
```

A bare `.Name` is an enumerator of whatever enum the context gives: an argument, an initializer element, a table index, or the other side of a comparison.

`...` spreads a vector, struct, array, or the results of a call into an argument list, an initializer, a return, or image coordinates. Vector initializers accept smaller vectors as lanes without it, as in `f32x4 { px.uv, glow, 1.0 }`.

```bento
let darker = f32x4 { ...rgb * 0.5, alpha };
let joined = [array; 5]f32 { ...f32x2 { x, y }, ...rgb };
let texel = cs.src[...t.global.xy];
```

## Operators

Precedence follows Go rather than C. In C `a & b == c` means `a & (b == c)`, almost never what anyone wants. In Bento it's `(a & b) == c`.

| Tightest first | Operators |
| --- | --- |
| Postfix | `f()` `a[i]` `.field` |
| Access | `&x` `*r` |
| Power | `**`, right to left |
| Unary | `-` `!` `~` |
| Cast | `as` |
| Multiplicative | `*` `/` `%` `<<` `>>` `&` |
| Additive | `+` `-` `\|` `^` |
| Comparison | `==` `!=` `<` `<=` `>` `>=` |
| Reduction | `any` `all` |
| And | `&&` |
| Or | `\|\|` |
| Conditional | `c ? a : b`, right to left |

`x ** n` multiplies `x` by itself for a constant `n`. Between matrices and vectors `*` is the linear algebra product, as in GLSL. Comparing vectors gives `b32` vectors, and `any` and `all` reduce them, as in `any a < b || all c > d` where GLSL needs `any(lessThan(a, b))`. Only the chosen side of `c ? a : b` runs.

`as` converts between numbers, from bools to numbers, between vectors and matrices of the same shape, and between enums or domains and their underlying types. Numbers never convert to bools. Write `x != 0` instead.

Integers are two's complement and wrap, signed or not. The smallest signed value divided by -1 is the exception: it's undefined at run time, the same as dividing by zero, and both are errors when the values are known while compiling. So are constant shifts past the bit width and constant indices out of range.

## Control flow

As in Go and Rust, conditions of `if` and `for` have no parentheses and their arms are always blocks. An `if` header can start with a `let` or `const` scoped to the whole chain.

```bento
fn classify(x: f32) -> i32 {
	if let y = x * 2; y > 10 {
		return 2;
	} else if y > 1 {
		return 1;
	} else {
		return 0;
	}
}
```

`for` is the only loop: `for init; condition; step`, `for condition`, or a bare `for`. A bare `for` that can never end is an error, and functions with results can't run off the end.

A uniformity qualifier before an `if` or `for` says how much of the machine agrees on its condition: `thread`, `simdgroup` (the default), or `workgroup`. Derivatives are errors where threads may have diverged, as [uniformity](uniformity.html) explains.

### Kill and demote

Fragment shaders have two ways to throw away a fragment. `kill` stops the thread right there. `demote` turns it into a *helper thread* that runs to the end with its outputs and writes thrown away, still there for the derivatives of its quad. Derivatives after a `kill` in divergent code are an error.

Most shading languages only have `discard`, and which of the two it means depends on the API and sometimes its version:

| API | What `discard` does |
| --- | --- |
| OpenGL | kills |
| Vulkan | either, depending on the driver |
| Direct3D 12 | demotes |
| WebGPU | demotes |
| Metal 2.2 and earlier | kills |
| Metal 2.3 and later | demotes |

Bento gives you both and their meaning never changes. Where a target lacks one, Shokado [emulates it](targets.html#kill-and-demote).

## Functions and results

Functions can be overloaded on their parameters, their results, and the memory spaces of references. A `.Name` argument picks the overload whose enum has that enumerator. Where GLSL and HLSL use `out` parameters, Bento functions return several results.

```bento
fn split(c: f32x4) -> (f32x3, f32) {
	return c.rgb, c.a;
}

fn half(x: f32) -> f32 { return x * 0.5; }
fn half(x: f16) -> f16 { return x * 0.5; }

fn tour(c: f32x4) -> f32 {
	let (rgb, alpha) = split(c);
	let h: f16 = half(2.0);
	return rgb.x + alpha + h as f32;
}
```

A parameter written `const`, as in `fn spin(at: f32x2, const turns: u32) -> f32x2`, only accepts an argument known at compile time. It's a [value parameter](#generics) written where an argument goes: each distinct argument gives `spin` an instance in which `turns` is a constant that can size an array or choose a `const if` arm.

### Function types

Functions can be passed to other functions. A function type is written like a declaration with no name or body, as in `fn(f32) -> f32`.

```bento
fn apply(cb: fn(i32) -> i32, x: i32) -> i32 {
	return cb(x);
}

fn twice(x: i32) -> i32 { return x * 2; }
fn halve(x: i32) -> i32 { return x / 2; }

const PICK = twice;

let a = apply(twice, 10);
let b = apply(wide ? twice : halve, 10);
let c = apply(PICK, 10) + PICK(1);
```

GPUs have no function pointers and a function is a value only while compiling. It can be passed, given to a `const`, or chosen with `?`, but never stored or returned. Functions that accept one are generic: `apply(twice, 10)` calls an instance of `apply` that calls `twice` directly.

`f!(...)` refers to `f` without calling it, with its `const` parameters filled in and `_` for the rest. `spin!(_, 4)` is a `fn(f32x2) -> f32x2` that always turns 4 times. It isn't a closure, just the instance `spin(x, 4)` calls.

## Methods

Methods are functions whose first parameter is named `self`, and `c.luminance()` is the same call as `luminance(c)`. There's no `impl` block. When `self` is a reference, Bento makes the reference for you.

```bento
struct Particle { position: f32x3, speed: f32 }

fn luminance(self: f32x3) -> f32 {
	return std::dot(self, f32x3 { 0.2126, 0.7152, 0.0722 });
}

fn fall(self: &storage Particle, dt: f32) {
	self.position.y -= self.speed * dt;
}

fn step(p: &storage Particle, color: f32x4, dt: f32) -> f32 {
	p.fall(dt);
	return color.rgb.luminance();
}
```

Methods can be declared on any type in any module, built-in types included, and method calls look through every import.

## Compile-time code

In Bento `const` always means known at compile time. A `const` declaration is computed while compiling, `const if` and `const for` are decided and unrolled then, and a [`const` parameter](#functions-and-results) only accepts arguments known then.

```bento
const FIBONACCI = (f32x2x2 { 1, 1, 1, 0 } ** 10)[0].x;
const POWER = 2 ** 3 ** 2;
const SWIZZLED = f32x4 { 1, 2, 3, 4 }.wzyx.x01y;
```

Bento folds these to `89.0`, `512`, and `{ 4, 0, 1, 3 }`. Wherever a constant is expected, a named constant converts by value like a literal: `const MASK: u8 = WIDTH - 1;` compiles as long as the value fits.

Unlike text hidden by a preprocessor `#if`, `const if` and `const for` are type checked like any other code. Only the chosen arm is compiled.

```bento
const TAPS = 4;

fn soften(c: f32x4) -> f32x4 {
	let sum: f32 = 0;
	const for let i = 0; i < TAPS; i += 1 {
		sum += c.x * (i as f32);
	}
	const if TAPS > 2 {
		sum *= 0.5;
	}
	return c * sum;
}
```

[Uber shaders](uber.html) are written the same way, over the members of a `feature`.

A `const fn` called with constant arguments runs at compile time on Shokado's VM. Called with run-time arguments it's an ordinary function. It can only call other `const fn`s and builtins without effects, and what would be undefined on a GPU, such as an index out of range, is an error with a note at every call that led there.

```bento
const fn fib(n: u32) -> u32 {
	let a: u32 = 0;
	let b: u32 = 1;
	for let i: u32 = 0; i < n; i += 1 {
		let c = a + b;
		a = b;
		b = c;
	}
	return a;
}

const FIB = fib(10);
```

`std::size_of` and `std::align_of` give the size and alignment of a type in storage memory, and `std::count_of` the number of lanes, columns, or elements an index covers. In a generic body they're known for each instance: a `const if` can test them, but array lengths can't use them.

```bento
struct Light { position: f32x3, power: f32 }

const STRIDE = std::size_of![Light]();   // 16
const LANES = std::count_of![f32x3]();   // 3
let scratch: [array; std::size_of![u64]()]f32;
```

## Generics

Generic parameters go in brackets after the name. `T: Numeric` is a type parameter, `T: Any` admits any type, and `M: Readable` or `M: Writable` is a memory space. Values known at compile time are [`const` parameters](#functions-and-results). Writing `const N` for a length in the type of a parameter makes `N` a value parameter read from the argument.

```bento
fn sum[T: Numeric](xs: [array; const N]T) -> T {
	let total: T = 0;
	for let i: u32 = 0; i < N; i += 1 {
		total += xs[i];
	}
	return total;
}

fn lerp[T: Floating](a: [vector; const N]T, b: [vector; N]T, t: T) -> [vector; N]T {
	return a + (b - a) * t;
}

let sky = lerp(dawn, noon, 0.25);
let gray = lerp![f16](a, b, 0.5);
```

Unlike templates in C++ and HLSL, generics are type checked once and can be exported through bytecode. Errors point at the definition or the call, never into an instance. Arguments are inferred or written with `f![...]`. The `!` marks them the way it marks a macro call in Rust: without it, `f[2]` would be an index and `f<2>` a comparison.

Bounds come in families, each in three forms: `Floating` admits `f16` and `f32`, `FloatingVector` vectors of them, and `FloatingLike` either. The families are `Signed`, `Unsigned`, `Boolean`, `Floating`, `Integral`, and `Numeric`, and each allows its own operations lane by lane:

| Family | Allows |
| --- | --- |
| `Numeric` | arithmetic, comparisons, and `as` |
| `Integral` | bitwise operators and the bit builtins |
| `Signed` | negative literals, `abs`, and `sign` |
| `Unsigned` | the unsigned builtins, like `add_carry` |
| `Floating` | float literals, the math library, and derivatives |
| `Boolean` | `true`, `false`, logic, and conditions |

`Any` allows only copying, passing, and returning. A bare `T` with no bound is an error.

Every check that depends on a value parameter is proven once, at the definition, for every value it allows. Without `requires N >= 3` below, `N` could be 2 and `v.z` would be rejected. A `const if` narrows `N` inside its arm the same way. `10 / (N - 4)` is rejected because `N` can be 4. Nothing is reported later, when an instance is made.

```bento
fn depth[T: Floating](v: [vector; const N]T) -> T requires N >= 3 {
	return v.z;
}

fn third(v: [vector; const N]f32) -> f32 {
	const if N >= 3 {
		return v.z;
	} else {
		return v.x;
	}
}
```

### Generic structs

Structs have type parameters in brackets, `const` parameters in parentheses, and a `requires` clause before the fields. Types name an instance with `!`, as in `Grad!(2)` or `Pair![i32]!(2)`, and struct literals infer it from their fields.

```bento
struct Grad(const n: u32) {
	dx: [vector; n]f32,
	dy: [vector; n]f32,
}

struct Pair[T: Numeric](const n: u32) requires n <= 3 {
	a: [vector; n]T,
	b: T,
}

fn slope(g: Grad!(2)) -> f32 {
	return g.dx.x + g.dy.y;
}

let g = Grad { dudx, dudy };
let p: Pair![i32]!(2) = { i32x2 { 1, 2 }, 3 };
```

Every instance is a struct of its own with its own layout. The struct is checked once where it's declared.

## Interfaces

Interfaces are named lists of function signatures, and any type for which those functions exist satisfies them. Unlike Rust and Slang, nothing declares conformance: there are no `impl` blocks or coherence rules.

```bento
interface Light[L: Any] {
	fn radiance(light: L, at: f32x3) -> f32x3;
	fn direction(light: L, at: f32x3) -> f32x3;
}

struct Point { position: f32x3, color: f32x3 }

fn radiance(light: Point, at: f32x3) -> f32x3 {
	let d = light.position - at;
	return light.color / std::dot(d, d);
}

fn direction(light: Point, at: f32x3) -> f32x3 {
	return std::normalize(light.position - at);
}

fn shade[L: Light](light: L, at: f32x3, n: f32x3) -> f32x3 {
	return radiance(light, at) * std::max(std::dot(n, direction(light, at)), 0.0);
}
```

Inside `shade` only the functions of `Light` are allowed, and a call with a `Point` finds them by ordinary overloading.

## Memory spaces

As with pointers in Metal, the memory space is part of every reference type, and references never convert between spaces.

| Space | Memory | GLSL | HLSL | Metal |
| --- | --- | --- | --- | --- |
| `thread` | variables of one thread | locals | locals | `thread` |
| `workgroup` | memory shared by a workgroup | `shared` | `groupshared` | `threadgroup` |
| `storage` | storage buffers, read and written | `buffer` | `RWByteAddressBuffer` | `device` |
| `constant` | constant buffers, read only | `uniform` | `cbuffer` | `constant` |

`&x` has the space of `x` and `*r` reads or writes through `r`. Fields, indices, and swizzles go through a reference without a `*`. References only exist as parameters and `let` bindings.

::: note
References passed to one call must not overlap, much as Swift rejects overlapping `inout` arguments. The check is conservative: `&v[0]` and `&v[1]` are fine but `&v[i]` and `&v[j]` aren't.
:::

Functions that work on a buffer element and a local alike have their space as a generic parameter. `Readable` admits every space and `Writable` all but `constant`. The space is inferred from the reference or written out, as in `bump![i32, storage](&x)`.

```bento
fn bump[T: Numeric, M: Writable](x: &M T) {
	*x += 1;
}

fn height[M: Readable](self: &M Particle) -> f32 {
	return self.position.y;
}

let n: i32 = 0;
bump(&n);
bump(&particles[i].speed);
let h = particles[i].height() + local.height();
```

Buffers, workgroup memory, and images can be passed to functions. Workgroup memory is declared with `let` and starts out undefined.

```bento
struct Sums {
	[[storage(0)]] values: [array; _]f32,
	[[storage(1)]] totals: [array; _]f32,
}

[[stage(.Compute), workgroup_size(64)]]
fn reduce(cs: Sums) with (t: Thread, group: WorkGroup) {
	let part: workgroup [array; 64]f32;
	part[t.index] = cs.values[t.global.x];
	thread if t.index == 0 {
		let sum: f32 = 0;
		for let i = 0; i < 64; i += 1 {
			sum += part[i];
		}
		cs.totals[group.id.x] = sum;
	}
}
```

In GLSL and HLSL barriers are written by hand. In Bento you don't write them. Bento puts one before the `thread if`, where the whole workgroup is still together, and splits a branch when there's no such point.

### Images, textures, and samplers

GLSL uses the word sampler for two things, a sampler object and a texture combined with one, as in `sampler2D`. Bento separates the two. A `sampler` is only a sampler object, and a texture combined with one is a *sampled texture*, `[sampled; N]T`.

| Bento | What it is | GLSL | Vulkan | Direct3D 12 | Metal |
| --- | --- | --- | --- | --- | --- |
| `[image; N]T` | storage image | a GLSL image | storage image | UAV | a Metal texture with `access::read_write` |
| `[texture; N]T` | texture data, read with `[]` | a GLSL sampler in OpenGL, read with `texelFetch` | sampled image | SRV | a Metal texture, read with `read` |
| `[sampled; N]T` | a texture combined with a sampler | a GLSL sampler | combined image sampler | SRV and a sampler | a Metal texture and a `sampler` |
| `sampler` | sampler object | none, an error in OpenGL | sampler | sampler | `sampler` |

Storage images are read and written with one integer coordinate per dimension, and their texels are always four component vectors.

```bento
struct Blit {
	[[image(0)]] src: [image; 2]f32,
	[[image(1)]] dst: [image; 2]f32,
}

[[stage(.Compute), workgroup_size(8, 8)]]
fn swap(cs: Blit) with (t: Thread) {
	let texel = cs.src[...t.global.xy];
	cs.dst[...t.global.xy] = texel.bgra;
}
```

Textures and sampled textures are bound with `texture(n)`. Indexing one reads a texel at level 0, or at a level written after the coordinates as in `t[x, y, level]`, much like `texelFetch` in GLSL. Cubes are written `[sampled; 6]f32`.

```bento
struct Surface {
	[[texture(0)]]  albedo: [sampled; 2]f32,
	[[location(0)]] uv:     f32x2,
}

let first = fs.albedo[0, 0];
```

Where GLSL spreads size queries over `textureSize`, `imageSize`, and `textureQueryLevels`, every image and texture has two methods: `dimensions`, at level 0 or the level you pass, and `levels`.

```bento
let size = t.dimensions();
let next = t.dimensions(1);
let count = t.levels();
```

#### Sampling

GLSL gives every combination of sampling choices a name, from `textureLod` to `textureProjGradOffset`, and HLSL does much the same. Bento follows Metal instead. Sampled textures have `sample`, `gather`, and `lod`, and every choice is a value of its own type after the coordinate:

```bento
let a = t.sample(uv);
let b = t.sample(uv, std::Bias { 0.5 });
let c = t.sample(uv, std::Level { 2.0 }, std::Offset { i32x2 { 1, -1 } });
let d = t.sample(uv, std::Grad { dx, dy }, std::Clamp { 1.0 });
let e = t.gather(uv, .G);
let (level, unclamped) = t.lod(uv);
let (f, resident) = t.sample(uv);
```

Combinations no API has don't type check, such as `Clamp` with an explicit `Level` or an offset on a cube. A second result reports whether every texel a sample touched was resident in a sparse texture. `sample` without a level, or with `Bias`, gets its level from derivatives and is only allowed in fragment shaders where threads haven't diverged. There are no projective forms.

Depth comparisons are methods of float sampled textures. `compare` returns the fraction of texels that passed, and `gather` with a reference returns the four results. Samplers either compare or sample, and one texture can be joined with one of each.

```bento
let shadow = [sampled; 2]f32 { fs.depth, fs.less };
let lit = shadow.compare(uv, depth, std::Level { 0.0 });
let nearest = [sampled; 2]f32 { fs.depth, fs.nearest };
let blockers = nearest.gather(uv, .R);
```

#### Layered and multisampled textures

`[layer; K]` in front of a texture makes it layered, with `K` layers or `_` for any count. Indexing a layer gives an ordinary texture of just that layer, to bind with `let` or pass to any function written for one.

```bento
struct Terrain {
	[[texture(0)]]                      albedo: [layer; 8][sampled; 2]f32,
	[[location(0), interpolate(.Flat)]] layer:  u32,
}

fn read(t: [sampled; 2]f32, at: i32x2) -> f32x4 {
	return t[...at];
}

let ground = read(fs.albedo[fs.layer], i32x2 { 4, 4 });
let first = fs.albedo[0][0, 0];
```

Where GLSL has `sampler2DMS` and passes the sample to `texelFetch`, Bento puts the samples in the texel type as an array. `[texture; 2][array; 4]f32` has 4 samples, and the sample is one more index after the coordinate:

```bento
struct Resolve {
	[[position]]   at:    f32x4,
	[[texture(0)]] color: [texture; 2][array; 4]f32,
}

let at = fs.at.xy as i32x2;
let sum = f32x4 { 0, 0, 0, 0 };
const for let i = 0; i < 4; i += 1 {
	sum += fs.color[...at][i];
}
```

Arrays, layers, and samples combine, and every level is indexed in order: `t[n][k][x, y][i]` reads sample `i` of layer `k` of texture `n`. Arrays of textures sit at one binding and need no `nonuniformEXT` or `NonUniformResourceIndex` by hand. Bento marks every index the uniformity analysis can't prove uniform.

Textures and samplers bound apart are joined in the shader, and one texture can be used with several samplers. OpenGL only allows sampled textures bound already combined.

```bento
struct Shade {
	[[texture(0)]]  albedo:  [texture; 2]f32,
	[[sampler(0)]]  nearest: sampler,
	[[location(0)]] uv:      f32x2,
}

let albedo = [sampled; 2]f32 { fs.albedo, fs.nearest };
let texel = albedo.sample(fs.uv);
```

#### Bindless

Images, textures, sampled textures, and samplers can also be stored in buffers and loaded from them. Stored handles have the same layout in Vulkan, Direct3D 12, Metal, and OpenGL: 16 bytes for a sampled texture and 8 for everything else.

```bento
struct Material {
	albedo: [sampled; 2]f32,
	mask:   [image; 2]f32,
	tint:   f32x4,
}

struct Shade {
	[[storage(0)]]                      materials: [array; _]Material,
	[[location(0), interpolate(.Flat)]] index:     u32,
	[[location(1)]]                     uv:        f32x2,
}

let material = fs.materials[fs.index];
let texel = material.albedo[0, 0] * material.tint;
```

Stored handles are ordinary values. They go in locals, structs, and arrays, back into buffers, and through `?:`. `as` converts them to and from integers, and a `u32` converts to a handle as its slot in the descriptor heap. Handles bound to an entry point have no stored form.

Structs of only resources, or only samplers, can live in the descriptor heap instead, bound with `heap` on a constant buffer that contains their starting slot. Reading a texture from one is a single fetch. Heaps of mixed textures use untyped `texture` and `image` elements.

```bento
struct Textures {
	albedo: [array; _][texture; 2]f32,
}

struct Lookup {
	[[constant(0), heap]]               textures: Textures,
	[[location(0), interpolate(.Flat)]] index:    u32,
}

let texel = fs.textures.albedo[fs.index][0, 0];
```

[Bindings and bindless](bindless.html) covers both models in depth.

## Entry points and stages

Entry points are declared with `[[stage(...)]]` and one of `.Vertex`, `.Fragment`, `.Compute`, `.Task`, or `.Mesh`. They can't be called and have at most one parameter. Compute entry points return nothing.

| Binding | Used on | Meaning |
| --- | --- | --- |
| `attribute(n)` | vertex input | vertex attribute `n` |
| `location(n)` | vertex output, fragment input | varying `n` |
| `color(n)` | fragment output | color attachment `n` |
| `color(0, 1)` | fragment output | second color of attachment 0, for [dual-source blending](#dual-source-blending) |
| `position`, `frag_depth` | vertex output, fragment output | clip position and depth, and `position` as a fragment input |
| `storage(n)`, `constant(n)` | input | storage and constant buffers |
| `image(n)`, `texture(n)`, `sampler(n)` | input | images, textures and sampled textures, and samplers |
| `scene(n)` | input | ray tracing scene |
| `interpolate(.Smooth \| .Flat \| .NoPerspective)` | varying | interpolation, flat for integers |

Every kind of resource is numbered separately from 0: `constant(0)` and `storage(0)` are two different buffers. [Bindings](targets.html#bindings) maps the numbers onto each API.

```bento
struct Mesh {
	[[attribute(0)]] position:  f32x3,
	[[attribute(1)]] uv:        f32x2,
	[[constant(0)]]  transform: f32x4x4,
}

struct Varyings {
	[[position]]    position: f32x4,
	[[location(0)]] uv:       f32x2,
}

struct Lit {
	...Varyings,
	[[constant(1)]] tint: f32x4,
}

struct Target {
	[[color(0)]] color: f32x4,
}

[[stage(.Vertex)]]
fn project(vs: Mesh) -> Varyings {
	return { vs.transform * vs.position.xyz1, vs.uv };
}

[[stage(.Fragment)]]
fn paint(fs: Lit) -> Target {
	return { fs.tint * std::fract(fs.uv.x) };
}
```

The fragment input includes the vertex output with `...Varyings`.

### Dual-source blending

*Dual-source blending* gives the blend a second color from the shader, read only by blend factors like `SRC1_COLOR`. Subpixel text uses it to blend each channel with its own coverage. Every language spells it differently:

| Language | Second color of attachment 0 |
| --- | --- |
| GLSL | `layout(location = 0, index = 1)` |
| HLSL | `SV_Target1` |
| Metal | `[[color(0), index(1)]]` |
| Bento | `[[color(0, 1)]]` |

```bento
struct Subpixel {
	[[color(0)]]    color:    f32x4,
	[[color(0, 1)]] coverage: f32x4,
}
```

Only `color(0)` has a second source, the one attachment Direct3D 12 and Metal can blend two sources into.

## Context parameters

In GLSL, built-in values such as the thread ID are globals like `gl_GlobalInvocationID`. In HLSL they're entry point parameters that every function needing one has to be passed by hand. In Bento a function names what it needs with `with` after the result.

```bento
fn hash_pixel(seed: u32) -> u32 with (frag: Fragment) {
	let p = frag.coord.xy as u32x2;
	return (p.x * 73856093) ^ (p.y * 19349663) ^ seed;
}
```

Callers have to provide every context a callee needs, from their own `with` clause or a `with` block around the call. Entry points have the built-ins of their stage, and each field is checked against the stages a function can be called from.

| Context | Fields | Stages |
| --- | --- | --- |
| `Thread` | `id`, `index`, `global` | compute, task, mesh |
| `WorkGroup` | `id`, `size`, `count` | compute, task, mesh |
| `SimdGroup` | `id`, `size`, `count`, `lane` | `size` and `lane` in every stage, `id` and `count` in compute, task, and mesh |
| `Vertex` | `index`, `instance`, `draw` | vertex |
| `Fragment` | `coord`, `front_facing` | fragment |

You can declare your own contexts with `context` and supply them in a `with` block to everything called inside it.

```bento
struct Camera {
	view:       f32x4x4,
	projection: f32x4x4,
}

context View: Camera;

fn to_clip(p: f32x3) -> f32x4 with (camera: View) {
	return camera.projection * (camera.view * p.xyz1);
}

struct Model {
	[[attribute(0)]] position: f32x3,
	[[attribute(1)]] uv:       f32x2,
	[[constant(0)]]  camera:   Camera,
}

[[stage(.Vertex)]]
fn project(vs: Model) -> Varyings {
	with (View = vs.camera) {
		return { to_clip(vs.position), vs.uv };
	}
}
```

Contexts are exported and imported like any other name, and calls into another module are checked against the `with` clause in its bytecode.

## Ray tracing

GLSL and HLSL have you declare a payload struct that hit and miss shaders write into. In Bento `trace(world, ray)` simply returns an `h32`, the built-in hit type, and the payload is whatever is live across the trace. Hit, miss, and callable shaders are ordinary functions, and materials are a `switch` on the hit.

```bento
struct Shadowed {
	[[scene(0)]]    world: scene,
	[[constant(1)]] sun:   f32x3,
	[[location(0)]] at:    f32x3,
}

struct Lit {
	[[color(0)]] light: f32,
}

[[stage(.Fragment)]]
fn shadow(fs: Shadowed) -> Lit {
	let ray = r32 { fs.at, fs.sun, 0.001, 1000.0 };
	let hit = trace(fs.world, ray);
	thread if hit.found {
		return { 0.0 };
	}
	return { 1.0 };
}
```

`scene` is the top-level acceleration structure and `r32` the ray. Procedural geometry uses an `[[intersect]]` function, and bounces are loops rather than recursion. The same source lowers to the Vulkan ray tracing pipeline, to ray queries in Vulkan, Direct3D 12, and Metal, and to software traversal in OpenGL and on GPUs without ray tracing hardware.

## Modules

Files that start with `module name;` are modules. Other modules use their `export`ed declarations through qualified names, or bring them in with `using`.

```bento light.bento
/// Lighting helpers.
module light;

import std;

/// A directional light.
export struct Sun {
	/// Unit vector toward the light.
	direction: f32x3,
	color:     f32x3,
}

export enum Mode { Flat, Lit }

export const AMBIENT: f32 = 0.1;

/// Lambert shading, plus a little ambient.
export fn shade(sun: Sun, n: f32x3, mode: Mode) -> f32x4 {
	if mode == .Flat {
		return f32x4 { ...sun.color, 1 };
	}
	let facing = std::max(std::dot(n, sun.direction), 0.0);
	return f32x4 { ...sun.color * (facing + AMBIENT), 1 };
}
```

```bento scene.bento
import std;
import light;
using light::Sun;
using module std;

struct Surface { [[location(0)]] normal: f32x3 }
struct Shaded { [[color(0)]] color: f32x4 }

[[stage(.Fragment)]]
fn main(fs: Surface) -> Shaded {
	let sun = Sun { normalize(f32x3 { 1, 1, 0 }), f32x3 { 1, 0.9, 0.8 } };
	return { light::shade(sun, normalize(fs.normal), .Lit) };
}
```

An import doesn't paste in source text the way `#include` does. Importers are compiled against the bytecode of a module, and linking happens at build time or at run time. A `///` comment documents the declaration after it and shows up on hover in the language server.

## Attributes

Attributes go in one `[[...]]` group in front of whatever they apply to. Besides the bindings above, there are:

stage(.Vertex | .Fragment | .Compute | .Task | .Mesh)
: entry point for that stage
workgroup_size(x, y, z)
: workgroup size of a compute, task, or mesh entry point, with missing dimensions 1
early_depth_test
: depth and stencil testing before a fragment entry point runs
math(.Reassoc, .Contract, .Transform, .NoNaNs, .NoInfs, .NoSignedZeros)
: [fast-math flags](floats.md) for a function or a block. A bare `math` makes floating point strict.
inline(true), inline(false)
: function always or never inlined
opcode(n)
: function without a body standing for IR instruction `n`, the way `std` is declared
assume, assume(n)
: unchecked promise about uniformity, covered in [uniformity](uniformity.md)
intersect
: intersection function for procedural ray tracing geometry

Attribute arguments are constant expressions, as in `[[workgroup_size(TILE, TILE / 2)]]`.

## Not in the language

- There's no preprocessor. Type checked `const if`, `const for`, generics, and modules do the jobs of macros and `#include`.
- There's no global scope. Values are passed through parameters, results, and contexts.
- Recursion isn't allowed.
- There's no `++`, comma operator, chained assignment, `f32(x)` cast, or `vec3(1.0)` constructor.
- Bento does not support Tessellation or Geometry shaders and requests to support them won't be accepted.
