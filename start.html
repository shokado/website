# Getting started

Shokado and Bento build with a C compiler and `make`, and `make install` copies the tools to the top of the tree:

```sh
make
make install
```

To vendor the library instead, `make unified` writes it as a single header in the style of stb. Include `bento.h` in one C or C++ file with `BENTO_IMPLEMENTATION` defined first:

```c
#define BENTO_IMPLEMENTATION
#include "bento.h"
```

## First shader

```bento hello.bento
import std;

struct Pixel {
	[[location(0)]] uv: f32x2,
}

struct Color {
	[[color(0)]] rgba: f32x4,
}

[[stage(.Fragment)]]
fn main(px: Pixel) -> Color {
	let corner = px.uv.x * px.uv.y;
	let glow = std::smoothstep(0.0, 1.0, corner);
	return { f32x4 { px.uv, glow, 1.0 } };
}
```

`bento-c` compiles the shader to bytecode, finding `std` along `-i`, and `skd-llc` generates GLSL and SPIR-V from it.

```sh
bento-c -i .build/debug hello.bento
skd-llc hello.sbc -o hello.frag
skd-llc --target=spirv hello.sbc -o hello.spv
```

## Editor support

VS Code and Sublime Text highlight Bento with one TextMate grammar. In either editor [`bento-lsp`](compiler.md#editor-support) adds diagnostics, hover, and go to definition.
