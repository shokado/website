# Library

## Host interface

Shokado and Bento build with `-nostdinc` and for WebAssembly because they depend on nothing, not even the freestanding C headers. The library never calls `malloc` or opens a file on its own. You provide memory, random bytes, files, and diagnostics through tables of callbacks.

SKDAllocator
: `alloc`, `realloc`, and `free`. All three are given the alignment and the last two the old size.
SKDRandom
: `fill` writes the random bytes that seed the hash tables of a context. Tests that need repeatable runs can return fixed bytes.
SKDFilesystem
: `open`, `close`, `query`, `read`, `write`, and `abspath`. It's optional and only used to make source paths in diagnostics absolute.
SKDReporter
: `display` is called with each diagnostic as soon as it's reported.

An optional `SKDClock` times each stage for profiling. Targets without unwinding of their own, such as WebAssembly, also give an `SKDExceptHandling` built on `setjmp` and `longjmp`.

There's no mutable global state. All state lives in the context and in objects you own. Every file compiles without warnings as C11 and C++11 under `-Wall -Wextra -pedantic`.

## Compiling at run time

Here's a complete program that compiles a source string to GLSL or SPIR-V in a buffer:

```c embed.c
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define BENTO_IMPLEMENTATION
#include "bento.h"

static const char SOURCE[] =
	"struct In { [[location(0)]] uv: f32x2 }\n"
	"struct Out { [[color(0)]] color: f32x4 }\n"
	"\n"
	"[[stage(.Fragment)]]\n"
	"fn main(fs: In) -> Out {\n"
	"\tlet cell = (fs.uv * 8.0) as i32x2;\n"
	"\tlet odd = (cell.x + cell.y) & 1;\n"
	"\treturn { f32x4 { ...fs.uv, odd as f32, 1.0 } };\n"
	"}\n";

static void* heap_alloc(void* udata, SKDLength size, SKDLength align) {
	(void)udata;
	return align <= 16 ? malloc(size ? size : 1) : NULL;
}

static void* heap_realloc(void* udata, void* data, SKDLength old_size,
                          SKDLength size, SKDLength align) {
	(void)udata, (void)old_size;
	return align <= 16 ? realloc(data, size ? size : 1) : NULL;
}

static void heap_free(void* udata, void* data, SKDLength size,
                      SKDLength align) {
	(void)udata, (void)size, (void)align;
	free(data);
}

static SKDBool random_fill(void* udata, void* data, SKDLength size) {
	FILE* const file = fopen("/dev/urandom", "rb");
	const SKDBool read = file && fread(data, 1, size, file) == size;
	(void)udata;
	if (file)
		fclose(file);
	return read;
}

static void display(void* udata, const SKDDiagnostic* d) {
	const SKDString kind = skd_diagnostic_kind_name(d->kind);
	(void)udata;
	if (d->line != 0)
		fprintf(stderr, "%.*s:%u:%u: ", (int)d->file.length,
			(const char*)d->file.buffer, d->line, d->column);
	fprintf(stderr, "%.*s: %.*s\n", (int)kind.length, (const char*)kind.buffer,
		(int)d->message.length, (const char*)d->message.buffer);
}

int main(int argc, char** argv) {
	const char* const target = argc > 1 ? argv[1] : "GLSL";
	const SKDAllocator heap = { heap_alloc, heap_realloc, heap_free, NULL };
	const SKDRandom random = { random_fill, NULL };
	const SKDSystem system = { NULL, &heap, &random, NULL, NULL };
	const SKDReporter reporter = { display, NULL };
	SKDContext context;
	BTOParser parser;
	BTOAST ast;
	SKDIRModule module;
	SKDOptStats stats;
	SKDBufferStream out;
	SKDString code = { NULL, 0 };

	if (!skd_context_init(&context, &system, &reporter)) {
		return 1;
	}
	bto_ast_init(&ast, &context);
	skd_ir_module_init(&module, &context);
	bto_parse_init(&parser, &ast);
	skd_buffer_stream_init(&out, NULL, &heap);

	SKDGenOptions options = skd_gen_default_options();
	options.entry = SKD_STRING("main");
	options.opt = SKD_OPT_ALL;

	SKDStatus status = bto_parse(&parser, SKD_STRING("checker.bento"),
		SKD_STRING(SOURCE), &context);
	if (status == SKD_STATUS_OK)
		status = bto_sema(&ast, NULL, 0, &module, 0, &context);
	if (status == SKD_STATUS_OK)
		status = skd_opt(&module, SKD_OPT_ALL, &stats, &context);
	SKDString name = skd_string_make((SKDUint8*)target, strlen(target));
	if (status == SKD_STATUS_OK)
		status = skd_gen(name, &module, &options, &out.stream, &context);
	if (status == SKD_STATUS_OK)
		status = skd_buffer_stream_result(&out, &code);
	if (status == SKD_STATUS_OK)
		fwrite(code.buffer, 1, code.length, stdout);

	skd_buffer_stream_fini(&out);
	skd_ir_module_fini(&module);
	bto_ast_fini(&ast);
	skd_context_fini(&context);
	return status == SKD_STATUS_OK ? 0 : 1;
}
```

```sh
cc -std=c11 -Wall -Wextra -pedantic embed.c -o embed
./embed SPIRV > checker.spv
```

## Public stages

Every stage of the compiler is public.

| Stage | Entry points |
| --- | --- |
| Context | `skd_context_init`, `skd_context_fini`, `skd_acquire_scratch`, `skd_release_scratch` |
| Lexer | `bto_lex_init`, `bto_lex_next` |
| Parser | `bto_parse_init`, `bto_parse`, `bto_ast_print`, `bto_ast_find` |
| Checker | `bto_sema` to check a tree and build its IR |
| IR | `skd_ir_module_init`, the builder, the editor, `skd_ir_print`, `skd_ir_strip` |
| Bytecode | `skd_ir_image_write`, `skd_ir_image_read` |
| Verifier | `skd_ir_verify` |
| Linker | `skd_link` |
| Optimizer | `skd_opt`, with passes chosen by flags |
| Generators | `skd_gen`, which lowers, optimizes, and generates for a target by name |
| VM | `skd_vm_load`, `skd_vm_call` |
| Streams | memory, file, and growing buffer streams |

Imports are modules in memory. To use a prebuilt module such as `std.sbc`, read the file yourself, load it with `skd_ir_image_read`, verify it, and pass it to `bto_sema` as an import. Then link the two with `skd_link` and optimize and generate as above.

## Memory

Every AST and IR module has an arena of its own and is freed in one call. The IR has no pointers into the AST or the source. Working memory comes from scratch arenas in the context, acquired with `skd_acquire_scratch` and given back with `skd_release_scratch`.

Running out of memory is an ordinary error. The first failed allocation is reported once and every stage returns `SKD_STATUS_OOM` from then on.

## Threads

Contexts are never shared between threads, but one thread can use several. ASTs and IR modules don't store a context and can be handed to another thread to be used there with its context. Contexts on different threads can share a `SKDSystem` and a `SKDReporter` when your allocator and reporter are thread safe.

## Untrusted input

No source and no bytecode can crash the library, hang it, or exhaust its memory. That matters as soon as you compile shaders you didn't write yourself.

- Nesting past a limit is an error, not a stack overflow.
- Every offset, length, and alignment in an image is checked before it's trusted, and nothing runs on bytecode until it's been verified.
- Hash tables are seeded from your `SKDRandom`. Names crafted to collide only work against a known seed.

Every stage that reads source or bytecode is fuzzed with libFuzzer under sanitizers. Any input that crashes the library, hangs it, or slips past an out of memory report is worth up to $500 USD under the [bug bounty](bounty.html).

## Single header

`make unified` generates `bento.h`, a single header in the style of stb. The implementation is compiled into the one file that defines `BENTO_IMPLEMENTATION` before including it.
