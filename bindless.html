# Bindings and bindless

::: note
**Explicit bindless:** the shader computes the slot of a descriptor in a heap whose layout you control and reads it straight from there.

**Implicit bindless:** the shader loads a handle from your buffer before it can read the descriptor it leads to.
:::

Getting a texture into a shader should be the easy part. It isn't. Once you go bindless the graphics APIs stop agreeing on almost anything, including what the things are called.

## Binding

Even plain binding is a mess. No two APIs agree on what a binding is:

| API | Resources are bound through | Described up front by |
| --- | --- | --- |
| Vulkan | descriptor sets, addressed by set and binding | a pipeline layout |
| Direct3D 12 | registers typed by the kind of view, `b`, `t`, `u`, and `s`, in register spaces | a root signature of descriptor tables, root descriptors, and root constants |
| Metal | an argument table for each of buffers, textures, and samplers | nothing, the indices are the binding |
| OpenGL | binding points for uniform and storage blocks, texture units, and image units | nothing, the units are the binding |

Samplers are a mess of their own:

| API | Textures and samplers |
| --- | --- |
| Vulkan | either combined, as a combined image sampler, or apart, as a sampled image and a sampler |
| Direct3D 12 | always apart, with samplers in a descriptor heap of their own |
| Metal | always apart |
| OpenGL | always combined, as a GLSL sampler |

Bento numbers every kind of resource separately from 0 and maps those numbers onto each API the same way every time:

| Bento | Vulkan | Direct3D 12 | Metal | OpenGL |
| --- | --- | --- | --- | --- |
| `constant(n)` | set 0 | `bn, space0` | buffer table | uniform block binding |
| `storage(n)` | set 0 | `un, space0` | buffer table | storage block binding |
| `texture(n)` | set 1 | `tn, space1` | texture table | texture unit |
| `image(n)` | set 1 | `un, space1` | texture table | image unit |
| `sampler(n)` | set 2 | `sn, space2` | sampler table | none |

The exact numbers and how to set up each API for them are on the [targets](targets.html#bindings) page.

## Bindless

Binding things one at a time doesn't scale to a scene with thousands of materials. Every API has settled on bindless, in two models each API names differently. In Bento they're *implicit bindless* and *explicit bindless*.

### Implicit bindless

With implicit bindless, handles are stored in memory like any other value and the shader loads one before it can read the resource. That's two indirections: the handle, then the descriptor it leads to. Every API had this first:

- Vulkan: descriptor indexing, core since Vulkan 1.2, with indices into runtime arrays.
- Direct3D 12: descriptor tables with unbounded ranges.
- OpenGL: `ARB_bindless_texture`, with 64-bit handles made resident first.
- Metal: argument buffers holding the `gpuResourceID` of each texture or sampler.

In Bento these are ordinary values. Images, textures, sampled textures, and samplers can be stored in buffers, passed to functions, and converted to and from integers with `as`. Every handle is 8 bytes and sampled textures are 16, the texture and then the sampler.

```bento
struct Material {
	albedo: [sampled; 2]f32,
	mask:   [image; 2]f32,
	tint:   f32x4,
}

struct Shade {
	[[storage(0)]]                      materials: [array; _]Material,
	[[location(0), interpolate(.Flat)]] index:     u32,
}

let material = fs.materials[fs.index];
let texel = material.albedo[0, 0] * material.tint;
```

### Explicit bindless

Explicit bindless skips the load. The descriptors live in a descriptor heap and the shader computes the slot it wants, one indirection:

- Direct3D 12: `ResourceDescriptorHeap` and `SamplerDescriptorHeap` from Shader Model 6.6.
- Vulkan: `VK_EXT_descriptor_heap`.
- Metal 4: resource view pools, with IDs contiguous from a `baseResourceID`.
- OpenGL: nothing like it.

This is the modern way and what new code should use. You'd think a heap would let you put anything in it, the way a Metal argument buffer does. On hardware like NVIDIA's the texture unit reads descriptors from a fixed pool for resources and a smaller one for samplers, and a heap is pretty much that pool handed to you. That's why there are two heaps, why the sampler heap is so small, and why heaps hold nothing but descriptors.

## Heaps in Bento

Structs that contain only resources, or only samplers, are bound as a heap by putting `heap` on a constant buffer:

```bento
struct Textures {
	albedo: [array; 1024][texture; 2]f32,
	masks:  [array; 64][image; 2]f32,
}

struct Filters {
	linear:  sampler,
	nearest: sampler,
}

struct Draw {
	[[constant(0), heap]]               textures: Textures,
	[[constant(1), heap]]               filters:  Filters,
	[[location(0), interpolate(.Flat)]] which:    u32,
}

[[stage(.Fragment)]]
fn shade(fs: Draw) -> Pixel {
	let albedo = [sampled; 2]f32 { fs.textures.albedo[fs.which], fs.filters.linear };
	return { albedo[1, 2] };
}
```

Constant buffer 0 doesn't contain the textures. It contains one `u32`, the slot where `Textures` starts in the resource heap, and every field and index after that is arithmetic on the slot. Reading `fs.textures.albedo[fs.which]` turns into:

| API | Read | Where the starting slot comes from |
| --- | --- | --- |
| Direct3D 12 | `ResourceDescriptorHeap[base + which]` | a root constant |
| Vulkan | slot `base + which` of `ResourceHeapEXT` | push data |
| Metal 4 | resource ID `base + which` | the pool's `baseResourceID` |

The rules follow from what a heap is. A heap struct contains only resources or only samplers. It never holds data or sampled textures, and those are joined in the shader from one of each. Only constant buffers can be heaps. Heaps have no length of their own, and the last field of a heap struct can be an array without one, such as `[array; _][texture; 2]f32`. Material tables then grow without compiling the shader again.

### Untyped textures and images

Real heaps mix every kind of texture. A field for every layout wastes slots on gaps. Heap structs can contain an untyped `texture` or `image` instead. Like an untyped literal, it has no dimensions or texel type until it's used:

```bento
struct Heap {
	textures: [array; _]texture,
}

let albedo: [texture; 2]f32 = fs.heap.textures[m.albedo];
let fog = sample_fog(fs.heap.textures[m.volume], at);
let ids = fs.heap.textures[m.ids] as [texture; 2]u32;
```

It settles from a `let` with a type, an argument, a field, `as`, or the other side of a `?:`, and a method call on one is an error until it has a type. An untyped `texture` never settles to an image. When textures and images share one range of slots, bind a heap struct for each over the same constant buffer:

```bento
struct Textures { slots: [array; _]texture }
struct Images   { slots: [array; _]image }

struct Draw {
	[[constant(0), heap]] textures: Textures,
	[[constant(0), heap]] images:   Images,
}
```

## Slots

Slots don't have to come from a heap struct. Any `u32` converts to a handle with `as`, as a slot in the resource heap, or the sampler heap for samplers, and `as u32` gives the slot back:

```bento
let albedo = material.albedo as [texture; 2]f32;
let filter = material.filter as sampler;
let texel = [sampled; 2]f32 { albedo, filter }.sample(uv);
```

Heap structs do the same arithmetic for you: `fs.textures.albedo[fs.which]` is `(base + which) as [texture; 2]f32`.

## Mixing them

Bound textures, implicit bindless, and explicit bindless can all be used in the same entry point. The two models only differ in where the number comes from, and where the target has a heap, handles stored in buffers are slots in that heap. A texture can come from the heap on one path and from a buffer on the other:

```bento
let t = fs.which > 3 ? fs.textures.albedo[fs.which] : fs.overrides[fs.which];
```

Here `overrides` is a buffer of textures. Textures bound to an entry point are the exception. They have no slot, and a value can't be a bound texture on one path and a texture from memory on the other.

## Without heaps

OpenGL, Metal before Metal 4, and Vulkan without `VK_EXT_descriptor_heap` have no heap, and slots work on them anyway:

- Vulkan: a slot indexes the descriptor arrays of implicit bindless.
- OpenGL and Metal: a slot indexes a table of 64-bit handles you fill.

## Non-uniform indices

Indices that differ between threads of a simdgroup have to be marked:

| API | Marking |
| --- | --- |
| Vulkan | `NonUniform` on the index and the descriptor in SPIR-V |
| Direct3D 12 | `NonUniformResourceIndex` in HLSL, the non-uniform flag of the handle in DXIL |
| Metal | none needed |
| OpenGL | none, and an index not proven uniform is an error |

Without a marking the driver may use the index of the first thread for all of them. Bento marks every index the [uniformity](uniformity.html) analysis can't prove uniform.
