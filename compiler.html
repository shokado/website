# Compiler and editors

bento-c
: Compiles source to bytecode and prints the syntax tree, the IR, or generated code on request.
bento-lsp
: Language server for diagnostics, hover, definitions, and outlines.

Linking and generating code for a target are done by the [tools](toolchain.html) of Shokado. `bento-c --help` lists its options, among them `--opt` and `--gen` to see the optimized IR or the code for one entry point, and `--steps` and `--memory` to raise the limits on code run at compile time.

## Diagnostics

`bento-c` reports every error in a file in one run. Errors read the way rustc prints them: the problem first, a `note` when it needs explaining, and a `help` with the fix.

```bento glow.bento
import std;

fn third[T: Floating](v: [vector; const N]T) -> T {
	return v.z;
}

fn brighten(x: &thread f32) {
	*x *= 2.0;
}

struct Frame {
	[[storage(0)]] pixels: [array; _]f32,
}

[[stage(.Compute), workgroup_size(64)]]
fn glow(cs: Frame) with (t: Thread) {
	let level = std::sqrt(cs.pixels[t.global.x]);
	let tint = std::normalise(f32x3 { level, level, 1.0 });
	brighten(level);
	brighten(&cs.pixels[t.global.x]);
}
```

```text bento-c glow.bento
glow.bento:4:11: error: 'z' is out of range when 'N' is 2
glow.bento:4:11: help: add 'requires N >= 3'
glow.bento:4:11: help: or wrap it in 'const if N >= 3'
glow.bento:18:13: error: unknown function 'std::normalise'; did you mean 'std::normalize'?
glow.bento:19:11: error: expected '&thread f32' but found 'f32'
glow.bento:19:11: help: add '&' to refer to it
glow.bento:20:11: error: expected '&thread f32' but found '&storage f32'
glow.bento:20:11: note: a reference to storage memory cannot be used as one to thread memory
glow.bento:20:11: help: copy the value into a 'let' and refer to that
```

Generics are checked once and the first error points at `third` itself rather than at a call.

## Editor support

VS Code and Sublime Text share one TextMate grammar and can both run `bento-lsp`:

| Editor | Package | Language server |
| --- | --- | --- |
| VS Code | `editors/vscode` | through the extension |
| Sublime Text | `editors/sublime` | through the LSP package |

`bento-lsp` publishes the diagnostics of `bento-c` on every change and supports hover with types and `///` doc comments, go to definition, and the document outline. The README of each package describes the setup.
