# Optimizer

Every pass is built on two facts about Shokado IR. Control flow is always structured, and passes see each `if` and loop directly instead of recovering them from a graph of branches the way LLVM does. And every instruction is pure, convergent, or impure. Convergent instructions such as derivatives and barriers depend on which threads run them together and never move across control flow.

## Passes

inlining
: Calls are inlined callees first, up to a budget that grows with the module. `inline(true)` and `inline(false)` override it.
mem2reg
: Locals loaded and stored whole become SSA values in one ordered walk, without the dominance frontiers LLVM's mem2reg computes.
sroa
: Structs and arrays never indexed at run time are split into one value per leaf.
invert
: Loops that test at the top become an `if` around a loop that tests at the bottom.
fold, algebra
: Constants fold through every operator and builtin, an `if` with a known condition becomes the arm that runs, and rewrites come from a table of rules.
ifconv
: Small `if`s whose arms are safe to run either way become a `select`.
cse
: Repeated instructions reuse the first result.
dse, rle
: One walk over memory removes stores nothing reads and replaces loads of known values. Members and constant indices are tracked apart: a store to `v.x` leaves what's known of `v.y` alone.
dce
: Mark and sweep, as in LLVM's ADCE. Even values that only feed each other around a loop are removed.
narrow
: Aggregates loaded only to read a few members become loads of just those members.
licm, sinking
: Pure instructions are hoisted out of loops and sunk into the one arm that uses them.
unrolling, fusion, fission
: Loops with a known trip count are unrolled under a size limit, neighbors with the same count are joined, and big ones are split to ease register pressure.

Passes are internal to the library. Hosts run them through `skd_opt` with a set of flags.

## Algebra

Exact rewrites always apply and the rest need a fast-math flag on the block. Rules are search and replace patterns in a small DSL of C macros:

```c
SKD(OP(BAND, IF(ONCE, BNOT, A), IF(ONCE, BNOT, B)), OP(BNOT, OP(BOR, A, B)), 0)
```

This rule rewrites `~a & ~b` to `~(a | b)` when neither `~` has another use. Commutative operators match either way around.

::: pair
```bento before
module algebra;

import std;
using module std;

export fn ident(x: i32, y: i32) -> i32 {
	return (x + 0) * 1 + (y - y) + (x ^ x);
}

export fn udiv7(x: u32) -> u32 {
	return x / 7;
}

export fn sdiv4(x: i32) -> i32 {
	return x / 4;
}

export fn morgan(a: u32, b: u32) -> u32 {
	return ~a & ~b;
}

export fn idiom(a: f32) -> f32 {
	return sign(a) * floor(abs(a) + 0.5);
}

export fn lanes(v: f32x4) -> f32x3 {
	return v.zyx.zyx;
}
```
```ir after
fn @ident(i32, i32) -> i32 export file 0
%bb0(%r1, %r2):
	return %r1

fn @udiv7(u32) -> u32 export file 0
%bb0(%r1):
	%r5, %r6 = umule %r1, $613566757
	%r7 = isub %r1, %r6
	%r8 = ushr %r7, $1
	%r9 = iadd %r6, %r8
	%r10 = ushr %r9, $2
	return %r10

fn @sdiv4(i32) -> i32 export file 0
%bb0(%r1):
	%r5 = ishr %r1, $31
	%r6 = band %r5, $3
	%r7 = iadd %r1, %r6
	%r4 = ishr %r7, $2
	return %r4

fn @morgan(u32, u32) -> u32 export file 0
%bb0(%r1, %r2):
	%r10 = bor %r1, %r2
	%r9 = bnot %r10
	return %r9

fn @idiom(f32) -> f32 export file 0
%bb0(%r1):
	%r4 = fsign %r1
	%r11 = fmul %r4, $0x1p-1
	%r12 = fadd %r1, %r11
	%r9 = ftrunc %r12
	return %r9

fn @lanes(f32x4) -> f32x3 export file 0
%bb0(%r1):
	%r5 = shuffle %r1, $xyz
	return %r5
```
:::

Division of a 32-bit integer by a constant becomes a multiply by a magic number and a shift, as in Hacker's Delight.

Cases the targets leave undefined, such as division by zero, are never folded. Folding them would fix one answer where the hardware is free to give another.

With `allowcontract`, a multiply followed by an add becomes one `fma`:

```ir bento-c --math-flags=nonans,allowcontract --opt mad.bento
fn @mad(f32, f32, f32) -> f32 export file 0
%bb0(%r1, %r2, %r3) fast(allowcontract, nonans):
	%r12 = fma %r1, %r2, %r3
	return %r12
```

The flags are saved in the bytecode and every later tool preserves them.
