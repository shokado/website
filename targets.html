# Targets

| Target | For | Name |
| --- | --- | --- |
| SPIR-V | Vulkan 1.0 to 1.4, and OpenGL 4.5 | `spirv` |
| AIR | Metal 3 and 4 on macOS, iOS, tvOS, and visionOS | `air` |
| DXIL | Direct3D 12 from Shader Model 6.9 | `dxil` |
| GLSL 4.50, GLSL ES 3.10 | OpenGL drivers without SPIR-V | `glsl` |
| VM | running the IR on the CPU | `vm` |
| C | rebuilding a module through the library | `bto` |
| nothing | checking a module | `null` |

Shokado generates one entry point at a time for a GPU and the whole module for the VM. None of the targets can pass buffers, workgroup memory, or images to a function. Building and linking copy such a function once for every set of globals it's called with instead, and run-time indices into them become extra parameters of the copy. Calls stay calls.

## Options

Every option is a flag of `skd-llc` and a field of `SKDGenOptions`, and `skd-llc --help` lists them all. They come in three kinds:

- What to generate and where it runs: `--entry`, `--env` for the Vulkan, OpenGL, or Apple release, `--spirv=1.N`, and `--es` for GLSL ES.
- What the device has: `--vk-` and `--gl-` flags named after a feature or an extension, such as `--vk-maintenance9` or `--gl-shader-integer-functions2`. Each one turns off the lowering that stands in for a missing instruction and lets the generator emit the native one. Hosts compiling on the machine the shader runs on fill these in from what the driver reports.
- `--math-flags`, which replaces the math flags of every block to check a shader strict or fast.

Options for one API are errors in an environment of the other. Only pass a device option the device really enables. Vulkan makes `OpSRem` poison for negative operands without `maintenance8`, and `--vk-maintenance8` writes it anyway.

### Driver quirks

Drivers have bugs too. The options with `quirk` in their names turn a lowering on and the driver never sees the built-in it mishandles. Drivers can't report their own bugs. Hosts choose the quirks from the vendor and version strings instead.

`--gl-quirk-unpack-unorm4x8` is for NVIDIA's OpenGL drivers as of 615.78.08, where `unpack_unorm4x8` feeding `precise` or `NoContraction` arithmetic comes back rounded to half precision. The quirk writes the normalized packs and unpacks with shifts, masks, and a divide by 255.

## Polyfills

Shokado IR is a superset of the builtins in GLSL, HLSL, and MSL plus whatever their extensions add. No target has all of that. When something's missing, Shokado lowers it into operations the target does have instead of giving up on your shader. Elsewhere you'd be checking for extensions and maintaining a fallback path by hand. With Bento you just write it.

There are way too many to list here, but a few of the more interesting ones:

- Floating-point atomics on targets without an extension for them become compare-and-swap loops on the bits. Values are reduced within the simdgroup first and only one elected lane per address runs the loop. A hot counter would otherwise have every lane fighting over it.
- Clustered simdgroup reductions are just shuffles.
- Direct3D only has exclusive scans. An inclusive scan is the exclusive one plus the lane's own value. Shuffles up, down, and by xor are reads from a computed lane.
- GLSL has no atomic loads or stores. They're an atomic or with zero and an exchange.
- `min3`, `max3`, and `med3` have a defined result for NaN even where `AMD_shader_trinary_minmax` leaves it undefined.
- HLSL's `msad4` and its packed byte and half dot products are available in Vulkan, OpenGL, and Metal too.
- Most targets can only count bits, reverse them, or count leading and trailing zeros at 32 bits. Bento lets you do it on 8 and 16-bit integers too.
- `nextafter`, `ilogb`, and `sinpi` are there even though GLSL and HLSL don't have any of them.

Kill and demote below are another good example.

## Kill and demote

Shokado emulates whichever one a target doesn't have:

| Target | `kill` | `demote` |
| --- | --- | --- |
| SPIR-V for Vulkan | `OpTerminateInvocation`, or `OpKill` before SPIR-V 1.6 | `OpDemoteToHelperInvocation`, with `shaderDemoteToHelperInvocation` |
| SPIR-V for OpenGL | `OpKill` | emulated |
| GLSL | `discard` | emulated |
| AIR | emulated | `discard_fragment` |
| DXIL | emulated | `discard` |

- OpenGL: a demoted thread sets a flag, skips its writes to storage buffers and images, and is killed when the entry point returns. `--gl-demote-to-helper-invocation` uses the extension on drivers known to have it. Drivers don't report it reliably.
- Metal and Direct3D 12: a thread is killed by demoting it and returning at once, and calls that can kill check a flag afterward.

## Bindings

Every kind of resource is numbered on its own from 0, and the shaders expect them in three groups: buffers, textures, and samplers.

| Bento | Vulkan | Direct3D 12 | Metal | OpenGL |
| --- | --- | --- | --- | --- |
| `constant(n)` | set 0, binding `n` | `register(bn, space0)` | `[[buffer(n)]]` | uniform block binding `n` |
| `storage(n)` | set 0, binding `C + n` | `register(un, space0)` | `[[buffer(C + n)]]` | storage block binding `n` |
| `texture(n)` | set 1, binding `n` | `register(tn, space1)` | `[[texture(n)]]` | texture unit `n` |
| `image(n)` | set 1, binding `T + n` | `register(un, space1)` | `[[texture(T + n)]]` | image unit `n` |
| `sampler(n)` | set 2, binding `n` | `register(sn, space2)` | `[[sampler(n)]]` | an error |

`C` and `T` are one more than the highest `constant(n)` and `texture(n)` used by any entry point in the module. With those two counts you know every binding without reflection.

- Vulkan: set 3 holds the descriptor arrays of stored handles. Leave out sets nothing uses, and give an unused set before a used one an empty layout.
- Direct3D 12: a sampled texture at `texture(n)` is the SRV at `tn` and the sampler at `sn` of space 1. Vertex attributes are `TEXCOORD` with index `n`.
- Metal: the buffers of a vertex descriptor go after the storage buffers.
- OpenGL: textures and sampled textures both become GLSL samplers at a texture unit, with `glBindSampler(n, ...)` for the sampler of a sampled one.

## Bindless

The [bindless](bindless.html) page explains *implicit bindless* and *explicit bindless*. Here's what each API needs.

Every handle stored in a buffer is 8 bytes, and stored sampled textures are 16: the texture, then the sampler.

| API | Stored handle | Setup |
| --- | --- | --- |
| Vulkan with `--vk-descriptor-heap` | a `u32` slot in the resource or sampler heap, then zero | `VK_EXT_descriptor_heap`, from the `vulkan1.1` environment |
| Vulkan | a `u32` index into the array of its kind in set 3, then zero | runtime arrays of sampled images at binding 0, storage images at 1, samplers at 2, and combined image samplers at 3 with `--vk-combined-image-samplers` |
| Direct3D 12 | a `u32` slot in the resource or sampler heap, then zero | `CBV_SRV_UAV_HEAP_DIRECTLY_INDEXED` and `SAMPLER_HEAP_DIRECTLY_INDEXED` on the root signature |
| OpenGL | the handle from `glGetTextureHandleARB` and the like, one combined handle for a sampled texture | every handle made resident before drawing |
| Metal | the `gpuResourceID` | every texture and sampler made resident |

Where there's a heap, a stored handle and a slot are the same number. Structs bound with `[[constant(n), heap]]` live in the heap itself and constant buffer `n` holds only their starting slot:

- Direct3D 12: `bn` of space 0 is a root constant.
- Vulkan: binding `n` of set 0 maps to push data with `VkShaderDescriptorSetAndBindingMappingInfoEXT`.
- Metal 4: the slots are views of a view pool and the buffer holds its `baseResourceID`.
- Without a heap, the slot indexes the descriptor arrays in Vulkan and a table of handles you fill in OpenGL and older Metal.

## SPIR-V

| `--env` | Default version | Newest allowed |
| --- | --- | --- |
| `vulkan1.0` | 1.0 | 1.0 |
| `vulkan1.1` | 1.3 | 1.3 |
| `vulkan1.2` | 1.5 | 1.5 |
| `vulkan1.3` | 1.6 | 1.6 |
| `vulkan1.4` | 1.6 | 1.6 |
| `opengl4.5` | 1.0, or 1.3 for simdgroup built-ins | 1.3 |

Storage buffers use std430 and constant buffers std140. Capabilities and extensions are only declared when something uses them. A `texture(n)` of a `[sampled; N]T` is a combined image sampler, and one of a `[texture; N]T` is a sampled image the shader joins with a `sampler(n)`.

### Float controls

When SPIR-V says nothing, Vulkan lets the driver contract, reassociate, and assume no NaNs or infinities on every float instruction. Shokado IR is strict unless a block has math flags, and the SPIR-V has to say so:

- With `SPV_KHR_float_controls2`, from `vulkan1.4` or with `--vk-shader-float-controls2` from `vulkan1.1`: a strict `FPFastMathDefault` for the entry point and `FPFastMathMode` on the instructions of blocks with flags. `NSZ`, `NotInf`, and `NotNaN` stay in every mask unless `--vk-signed-zero-inf-nan-preserve` says the device can preserve them.
- Otherwise: `NoContraction` on the arithmetic of every block without `allowtransform`, and `SignedZeroInfNanPreserve` for the entry point when the device preserves them. OpenGL has only `NoContraction`.

## AIR for Metal

AIR is the IR of Metal and close to LLVM IR. Metal is also the API closest to Shokado IR: its address spaces match the memory spaces one for one and neither has globals. The output is a `.metallib` for `newLibraryWithData:`, with bitcode in the format of LLVM 13 that Shokado writes itself. Math flags become LLVM fast-math flags.

The environment names the platform and release the way `metal -target` does:

| `--env` | AIR | Metal |
| --- | --- | --- |
| `macos13`, `ios16`, `tvos16` | 2.5 | 3.0 |
| `macos14`, the default, `ios17`, `tvos17`, `xros1` | 2.6 | 3.1 |
| `macos15`, `ios18`, `tvos18`, `xros2` | 2.7 | 3.2 |
| `macos26`, `ios26`, `tvos26`, `xros26` | 2.8 | 4.0 |

Simulators add `-simulator` to the `ios`, `tvos`, and `xros` names, and Mac Catalyst adds `-macabi` to the `ios` ones.

## DXIL for Direct3D 12

The output is a `.dxil` container ready for `D3D12_SHADER_BYTECODE`. It passes the DXIL validator, signatures and checksum included, with no DXC or Windows SDK involved. The minimum is Shader Model 6.9 and vectors stay vectors. vkd3d-proton needs dxil-spirv at commit 139467f or later.

Storage buffers are raw buffers laid out with std430 and constant buffers use std140. LLVM 3.7 has no flag for `allowcontract` or `allowreassoc` and those two are dropped. `Vertex.index` and `Vertex.instance` add `StartVertexLocation` and `StartInstanceLocation` and count from the base of the draw, as in Vulkan and Metal.

## GLSL

`--es` writes GLSL ES 3.10 with `GL_OES_gpu_shader5` instead of GLSL 4.50. Shaders with 1D images, 64-bit integers, or images read without a format can't be generated as GLSL ES.

GLSL has no math flags. The float results of every block without `allowtransform` are `precise` instead. `precise` reaches everything that feeds the value, and fast arithmetic that flows into strict code turns strict as well.

GLSL reserves names starting with `gl_` or containing `__`. Shokado writes `light::shade` as `light_shade`, `gl_ray` as `glx_ray`, and `a__b` as `a_x_b`, and gives a suffix to names that clash.

## VM

`--target=vm` writes a program for Shokado's own VM, the one Bento runs `const fn` calls on. `skd_vm_load` loads it and `skd_vm_call` runs any function of it with constants in and out. It's threaded code, every handler jumping straight into the next, and what's undefined on a GPU gives a defined result plus an error with a stack trace once the run ends.

## C

`--target=bto` writes C: a function `bento_build(module, context)` that rebuilds the module through the IR builder. It embeds a shader in a program without bytecode and doubles as an example of building IR by hand.

## Generating from code

Generating any target is one call with its name. It runs the lowering passes the target needs, the optimizer with the passes in `options.opt`, and the generator:

```c
SKDGenOptions options = skd_gen_default_options();
options.entry = SKD_STRING("main");
options.environment = SKD_STRING("vulkan1.3");
options.opt = SKD_OPT_ALL;
status = skd_gen(SKD_STRING("SPIRV"), &module, &options, &out.stream, &context);
```

Lowering rewrites the module in place. Hosts generating for several targets give each one a copy from `skd_ir_module_clone`, and `skd_gen_lower` runs only the lowering. The output goes to a buffer, a file, or a stream of your own.
